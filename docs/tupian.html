<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>图片社区 — Local Dream ET</title>
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
  :root{--bg:#fff;--ink:#111418;--mut:#6b7280;--line:#e8eaee;--soft:#f4f5f7;--bad:#d9534f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
  .navin{max-width:960px;margin:0 auto;padding:0 24px;display:flex;gap:18px;align-items:center}
  .brand{font-weight:700}
  a{color:inherit;text-decoration:none}
  h1{font-size:24px;margin:24px 0 6px}
  .mut{color:var(--mut);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin:18px 0}
  .card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
  .card img{width:100%;height:160px;object-fit:cover;display:block;background:var(--soft)}
  .card .ph{width:100%;height:160px;background:var(--soft);color:var(--mut);display:none;align-items:center;justify-content:center;font-size:13px}
  .card .bd{padding:10px 12px}
  .card .t{font-size:13px;font-weight:600;margin-bottom:4px}
  .card .m{color:var(--mut);font-size:12px;margin-bottom:8px}
  .card a.dl{display:inline-block;padding:6px 12px;border:1px solid var(--ink);border-radius:8px;font-size:12px;font-weight:600;margin-right:6px}
  .card button.del{padding:6px 10px;border:1px solid var(--bad);border-radius:8px;background:#fff;color:var(--bad);font-size:12px;cursor:pointer}
  .empty{color:var(--mut);padding:30px;text-align:center}
  select,input{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}
  button.go{padding:8px 14px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;font:inherit}
</style>
</head>
<body>

<nav><div class="navin"><span class="brand">图片社区</span><a href="index.html">返回官网</a></div></nav>

<div class="wrap">
  <h1>图片社区</h1>
  <p class="mut">App 内共享图片赚额度，也可花额度购买他人作品；此处免费下载无水印原图。</p>
  <div style="display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap">
    <label class="mut">作者筛选：</label>
    <select id="authorSel"><option value="">全部</option></select>
    <span class="mut" id="status"></span>
  </div>
  <div id="adminBar" style="margin:10px 0;display:none;gap:8px;flex-wrap:wrap">
    <input id="adminTok" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="text" spellcheck="false" placeholder="gh 令牌（删除用，可选）" style="flex:1;min-width:240px" />
    <button class="go" id="adminSave">保存令牌</button>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
(function(){
  "use strict";
  var REPO="ETQWFD/LocalDreamET-Gallery";
  var API="https://api.github.com/repos/"+REPO+"/contents/png";
  var RAW="https://raw.githubusercontent.com/"+REPO+"/main/png";
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","'":"&quot;"}[c];});}
  function fmtTs(ts){if(!ts)return"";try{var t=ts;if(typeof t==="number"&&t<1e12)t=t*1000;else if(typeof t==="string"&&/^\d+$/.test(t)&&Number(t)<1e12)t=Number(t)*1000;return new Date(t).toLocaleDateString("zh-CN");}catch(e){return "";}}
  function tok(){try{return sessionStorage.getItem("et_gallery_gh")||"";}catch(e){return "";}}
  function setTok(t){try{sessionStorage.setItem("et_gallery_gh",t);}catch(e){}}
  var all=[];
  function hdr(){return tok()?{"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"}:{"Accept":"application/vnd.github+json"};}

  function load(){
    $("status").textContent="加载中…";
    fetch(API,{headers:hdr()}).then(function(r){if(r.status===404)throw new Error("empty");if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
    .then(function(files){
      var imgs=files.filter(function(f){return /\.(png|jpg|jpeg|webp)$/i.test(f.name);});
      return Promise.all(imgs.map(function(f){
        var meta=RAW+"/"+f.name.replace(/\.([a-z]+)$/i,".meta.$1");
        return fetch(meta).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}).then(function(m){return {name:f.name,sha:f.sha,meta:m,url:RAW+"/"+f.name};});
      }));
    })
    .then(function(arr){
      all=(arr||[]).filter(Boolean).sort(function(a,b){return((b.meta&&b.meta.ts)||0)-((a.meta&&a.meta.ts)||0);});
      fillAuthors();render();
    })
    .catch(function(e){$("grid").innerHTML='<div class="empty">'+(e.message==="empty"?"社区暂无图片，去 App 内发布第一张吧。":"加载失败："+esc(e.message))+'</div>';$("status").textContent="";});
  }
  function fillAuthors(){
    var as={};all.forEach(function(x){if(x.meta&&x.meta.author)as[x.meta.author]=1;});
    var sel=$("authorSel");var cur=sel.value;
    sel.innerHTML='<option value="">全部</option>'+Object.keys(as).sort().map(function(a){return '<option value="'+esc(a)+'">'+esc(a)+'</option>';}).join("");
    sel.value=cur;
  }
  function dl(url,name){
    function fallback(){var a=document.createElement("a");a.href=url;a.download=name;a.target="_blank";a.rel="noopener";document.body.appendChild(a);a.click();a.remove();}
    fetch(url).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.blob();})
      .then(function(b){var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);})
      .catch(function(){fallback();});
  }
  function render(){
    var au=$("authorSel").value;
    var rows=au?all.filter(function(x){return x.meta&&x.meta.author===au;}):all;
    if(!rows.length){$("grid").innerHTML='<div class="empty">暂无图片。</div>';$("status").textContent="共 "+all.length+" 张。";return;}
    /* 按批次（同作者+ts差<5s）分组 */
    rows=rows.slice().sort(function(a,b){return((a.meta&&a.meta.ts)||0)-((b.meta&&b.meta.ts)||0);});
    var groups=[];var cur=null;
    rows.forEach(function(x){
      var t=(x.meta&&x.meta.ts)||0;var a=(x.meta&&x.meta.author)||"";
      if(cur&&cur.author===a&&Math.abs(t-cur.ts)<5000){cur.items.push(x);}
      else{cur={author:a,ts:t,items:[x]};groups.push(cur);}
    });
    $("grid").innerHTML=groups.map(function(g){
      var m=g.items[0].meta||{};
      if(g.items.length>=2){
        var imgs=g.items.map(function(x,i){return '<div style="position:relative"><div class="ph">加载失败</div><img src="'+esc(x.url)+'" loading="lazy" onerror="this.style.display=\'none\';this.previousElementSibling.style.display=\'flex\'"/><button class="dl" data-dl="'+esc(x.url)+'" data-name="'+esc(x.name)+'" style="position:absolute;bottom:4px;right:4px;padding:3px 8px;font-size:11px">下载</button></div>';}).join("");
        return '<div class="card" style="grid-column:1/-1"><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:4px">'+imgs+'</div><div class="bd"><div class="t">'+esc(m.title||"图集")+'</div><div class="m">'+esc(m.author||"匿名")+" · "+g.items.length+" 张 · "+esc(fmtTs(m.ts))+'</div></div></div>';
      }
      var x=g.items[0];
      var del=tok()?'<button class="del" data-del="'+esc(x.name)+'" data-sha="'+esc(x.sha)+'">删除</button>':'';
      return '<div class="card"><div class="ph">加载失败</div><img src="'+esc(x.url)+'" loading="lazy" onerror="this.style.display=\'none\';this.previousElementSibling.style.display=\'flex\'"/><div class="bd"><div class="t">'+esc(m.title||x.name)+'</div><div class="m">'+esc(m.author||"匿名")+(m.price?" · "+esc(m.price)+" 额度":"")+" · "+esc(fmtTs(m.ts))+'</div><button class="dl" data-dl="'+esc(x.url)+'" data-name="'+esc(x.name)+'">下载原图</button>'+del+'</div></div>';
    }).join("");
    $("status").textContent="共 "+rows.length+" 张。";
  }
  $("authorSel").addEventListener("change",render);
  $("adminSave").addEventListener("click",function(){setTok($("adminTok").value.trim());alert(tok()?"令牌已保存，可删除图片。":"已清除令牌。");render();});
  $("grid").addEventListener("click",function(e){
    var dl=e.target.closest("[data-dl]");if(dl){dl(dl.getAttribute("data-dl"),dl.getAttribute("data-name"));return;}
    var b=e.target.closest("[data-del]");if(!b)return;
    if(!tok()){alert("请先输入 gh 令牌");return;}
    var name=b.getAttribute("data-del"),sha=b.getAttribute("data-sha");
    if(!confirm("删除 "+name+"？"))return;
    fetch(API+"/"+name,{method:"DELETE",headers:hdr(),body:JSON.stringify({message:"del "+name,sha:sha,branch:"main"})})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);$("status").textContent="已删除";load();})
      .catch(function(e){$("status").textContent="删除失败："+e.message;});
  });
  /* 管理员入口：长按标题或 ?admin=1 */
  if(/[?&]admin=1/.test(location.search)||tok())$("adminBar").style.display="flex";
  load();
})();
</script>

</body>
</html>
