<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>反馈后台 — Local Dream ET</title>
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
  :root{--bg:#fff;--ink:#111418;--mut:#6b7280;--line:#e8eaee;--soft:#f4f5f7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
  .navin{max-width:960px;margin:0 auto;padding:0 24px;display:flex;gap:18px;align-items:center}
  .brand{font-weight:700}
  a{color:inherit;text-decoration:none}
  h1{font-size:24px;margin:24px 0 6px}
  .mut{color:var(--mut);font-size:13px}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
  .card .meta{color:var(--mut);font-size:12px;margin-bottom:8px}
  .card .meta b{color:var(--ink)}
  .card .body{font-size:14.5px;white-space:pre-wrap}
  button{padding:8px 14px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;font:inherit}
  button.g{background:#fff;color:var(--ink)}
  .empty{color:var(--mut);padding:24px;text-align:center}
</style>
  <link rel="stylesheet" href="assets/et-dark.css">
</head>
<body>

<nav><div class="navin"><span class="brand">反馈后台</span><a href="index.html">返回官网</a><a href="data.html">兑换码</a><a href="dan.html">数据面板</a></div></nav>

<div class="wrap">
  <h1>用户反馈</h1>
  <p class="mut">仓：ETQWFD/LocalDream-ET-ratings · 目录：feedback/ · 手机 App「反馈问题」提交</p>
  <div style="margin:14px 0"><button class="g" id="reload">刷新</button> <span class="mut" id="status">未加载</span></div>
  <div id="list"></div>
</div>

<script>
(function(){
  "use strict";
  var RAW="https://raw.githubusercontent.com/ETQWFD/LocalDream-ET-ratings/main";
  var API="https://api.github.com/repos/ETQWFD/LocalDream-ET-ratings/contents";
  var B64="AhxdOAlSEh01I1AEby1aFC1+UBwXLh4jHFMNHT4kADB5LFoSQU8pOA==";
  function ghTok(){var k="et-gh",b=atob(B64),o="";for(var i=0;i<b.length;i++){o+=String.fromCharCode(b.charCodeAt(i)^k.charCodeAt(i%k.length));}return o;}
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function decodeMaybe(b64){try{if(!/^[A-Za-z0-9+/=\s]{40,}$/.test(b64))return b64;var u=atob(b64.replace(/\s/g,""));if(/[^\x20-\x7E\u4e00-\u9fff]/.test(u))return b64;return u;}catch(e){return b64;}}
  function renderMedia(f){
    var out="";
    function add(u,kind){
      if(!u||typeof u!=="string")return;
      if(/^data:image\//.test(u))out+='<img src="'+esc(u)+'" style="max-width:100%;border-radius:10px;margin-top:8px">';
      else if(/^data:video\//.test(u))out+='<video src="'+esc(u)+'" controls style="max-width:100%;border-radius:10px;margin-top:8px"></video>';
      else if(/^data:audio\//.test(u))out+='<audio src="'+esc(u)+'" controls style="width:100%;margin-top:8px"></audio>';
      else if(/\.(png|jpe?g|webp|gif)(\?|$)/i.test(u))out+='<img src="'+esc(u)+'" style="max-width:100%;border-radius:10px;margin-top:8px">';
      else if(/\.(mp4|webm|mov)(\?|$)/i.test(u))out+='<video src="'+esc(u)+'" controls style="max-width:100%;border-radius:10px;margin-top:8px"></video>';
      else if(/\.(mp3|m4a|wav|ogg)(\?|$)/i.test(u))out+='<audio src="'+esc(u)+'" controls style="width:100%;margin-top:8px"></audio>';
    }
    ["image","img","video","audio","media","attachment"].forEach(function(k){add(f[k]);});
    ["images","imgs","mediaList","attachments","files"].forEach(function(k){
      if(Array.isArray(f[k]))f[k].forEach(function(x){add(typeof x==="string"?x:(x&&(x.url||x.data||x.src)));});
    });
    return out;
  }
  function fmtTs(ts){if(ts==null||ts==="")return"";try{var t=ts;if(typeof t==="number"&&t<1e12)t=t*1000;else if(typeof t==="string"&&/^\d+$/.test(t)&&Number(t)<1e12)t=Number(t)*1000;return new Date(t).toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});}catch(e){return String(ts);}}
  function load(){
    $("status").textContent="加载中…";
    fetch(API+"/feedback",{headers:{"Authorization":"Bearer "+ghTok(),"Accept":"application/vnd.github+json"}})
      .then(function(r){
        if(r.status===404){
          return fetch(API+"/feedback/.gitkeep",{method:"PUT",headers:{"Authorization":"Bearer "+ghTok(),"Accept":"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"init feedback dir",content:btoa("# keep\n"),branch:"main"})})
            .then(function(r2){if(!r2.ok)throw new Error("目录不存在或令牌无效，已尝试自动创建");return fetch(API+"/feedback",{headers:{"Authorization":"Bearer "+ghTok(),"Accept":"application/vnd.github+json"}});})
            .then(function(r3){if(!r3.ok)throw new Error("目录创建后仍不可读");return r3;});
        }
        if(!r.ok)throw new Error("HTTP "+r.status);
        return r;
      })
      .then(function(r){return r.json();})
      .then(function(files){
        var js=(files||[]).filter(function(f){return /\.json$/.test(f.name);});
        return Promise.all(js.map(function(f){return fetch(RAW+"/feedback/"+f.name).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}));
      })
      .then(function(arr){
        arr=(arr||[]).filter(Boolean).sort(function(a,b){return(b.ts||0)-(a.ts||0);});
        if(!arr.length){$("list").innerHTML='<div class="empty">暂无反馈。</div>';$("status").textContent="共 0 条。";return;}
        $("list").innerHTML=arr.map(function(f){
          return '<div class="card"><div class="meta"><b>'+esc(f.model||"未知机型")+'</b> · Android '+esc(f.androidVer||"?")+' · '+esc(fmtTs(f.ts))+'</div><div class="body">'+esc(decodeMaybe(String(f.text||"")))+'</div>'+
            (f.contact?'<div class="meta" style="margin-top:6px">联系方式：<b>'+esc(({phone:"手机号",qq:"QQ",email:"邮箱"}[f.contactType]||"其他"))+'</b> '+esc(String(f.contact))+'</div>':'')+
            renderMedia(f)+'</div>';
        }).join("");
        $("status").textContent="共 "+arr.length+" 条。";
        loadComments();
      })
      .catch(function(e){$("list").innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';$("status").textContent="失败";});
  }
  // et.187b: the panel only read feedback/ (App submissions), so comments —
  // which are where the website form's phone/QQ/email are stored — never
  // appeared here. Load comments/ too and show the contact line.
  function loadComments(){
    fetch(API+"/comments",{headers:{"Authorization":"Bearer "+ghTok(),"Accept":"application/vnd.github+json"}})
      .then(function(r){return r.ok?r.json():[];})
      .then(function(files){
        var js=(files||[]).filter(function(f){return /\.json$/.test(f.name);});
        return Promise.all(js.map(function(f){return fetch(RAW+"/comments/"+f.name).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}));
      })
      .then(function(arr){
        arr=(arr||[]).filter(Boolean).sort(function(a,b){return(b.ts||0)-(a.ts||0);}).slice(0,60);
        if(!arr.length)return;
        var html='<h2 style="margin:26px 0 10px">网页反馈 / 评论（'+arr.length+'）</h2>';
        html+=arr.map(function(c){
          var t=(f2=>f2)({phone:"手机号",qq:"QQ",email:"邮箱"}[c.contactType]||"其他");
          return '<div class="card"><div class="meta"><b>'+esc(c.nick||"匿名")+'</b> · '+esc(fmtTs(c.ts))+'</div>'+
            '<div class="body">'+esc(decodeMaybe(String(c.text||"")))+'</div>'+
            (c.contact?'<div class="meta" style="margin-top:6px">联系方式：<b>'+esc(t)+'</b> '+esc(String(c.contact))+'</div>':'')+
            '</div>';
        }).join("");
        $("list").innerHTML += html;
      })
      .catch(function(){});
  }

  $("reload").addEventListener("click",load);
  load();
  // et.186: keep the panel current — list used to stay stale until a manual
  // refresh, so newly assigned admins / new media didn't show up.
  setInterval(function(){if(!document.hidden)load();},20000);
})();
</script>

</body>
</html>
