<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>兑换码管理 — Local Dream ET</title>
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
  :root{--bg:#fff;--ink:#111418;--mut:#6b7280;--line:#e8eaee;--soft:#f4f5f7;--bad:#d9534f;--ok:#3a9d5d}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
  .navin{max-width:960px;margin:0 auto;padding:0 24px;display:flex;gap:18px;align-items:center}
  .brand{font-weight:700}
  a{color:inherit;text-decoration:none}
  section{padding:32px 0;border-top:1px solid var(--line)}
  h1{font-size:24px;margin:0 0 6px}
  h2{font-size:18px;margin:24px 0 12px}
  .mut{color:var(--mut);font-size:13px}
  input,select,textarea{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}
  button{padding:9px 16px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;font:inherit}
  button.g{background:#fff;color:var(--ink)}
  button.d{background:#fff;color:var(--bad);border-color:var(--bad)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px}
  th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
  th{background:var(--soft)}
  .status-unused{color:var(--ok);font-weight:600}
  .status-used{color:var(--mut)}
  .hidden{display:none}
  .note{color:var(--mut);font-size:12.5px;margin:8px 0}
</style>
</head>
<body>

<nav><div class="navin"><span class="brand">兑换码管理</span><a href="index.html">返回官网</a><a href="admin.html">反馈后台</a><a href="dan.html">数据面板</a></div></nav>

<div class="wrap">
  <h1>兑换码管理</h1>
  <p class="mut">仓：ETQWFD/LocalDreamET-Quota · 目录：redeem/codes/ · 令牌仅存本地 sessionStorage，不上传。</p>

  <section id="loginSec">
    <h2>1. 输入 GitHub 私人令牌</h2>
    <input id="ghToken" type="password" placeholder="ghp_..." style="flex:1;min-width:280px" />
    <button id="btnLogin">确认加载</button>
    <div class="note">需要 repo 写权限；令牌只在本浏览器内存/会话中使用。</div>
  </section>

  <section id="codesSec" class="hidden">
    <h2>2. 兑换码列表</h2>
    <div class="row">
      <input id="newCode" placeholder="9位兑换码（留空自动生成）" style="width:200px" />
      <select id="newEffect">
        <option value="quota">赠送额度</option>
      </select>
      <input id="newValue" type="number" placeholder="数值，如 700" style="width:120px" value="700" />
      <button id="btnAdd">添加兑换码</button>
      <button id="btnReload" class="g">刷新</button>
      <span id="status" class="mut"></span>
    </div>
    <table>
      <thead><tr><th>兑换码</th><th>效果</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </section>
</div>

<script>
(function(){
  "use strict";
  var REPO="ETQWFD/LocalDreamET-Quota";
  var API="https://api.github.com/repos/"+REPO+"/contents";
  var RAW="https://raw.githubusercontent.com/"+REPO+"/main";
  function $(id){return document.getElementById(id);}
  function tok(){try{return sessionStorage.getItem("et_quota_gh")||"";}catch(e){return "";}}
  function setTok(t){try{sessionStorage.setItem("et_quota_gh",t);}catch(e){}}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function hdr(){return {"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json","Content-Type":"application/json"};}
  function fmtTs(ts){if(!ts)return"";try{return new Date(ts).toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"});}catch(e){return ts;}}
  function genCode(){var c="";var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";for(var i=0;i<9;i++)c+=a[Math.floor(Math.random()*a.length)];return c;}

  function listCodes(){
    $("status").textContent="读取中…";
    fetch(API+"/redeem/codes",{headers:hdr()}).then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error("HTTP "+r.status+" "+t.slice(0,120));});return r.json();})
    .then(function(files){
      var js=files.filter(function(f){return /^redeem_.*\.json$/.test(f.name);});
      return Promise.all(js.map(function(f){return fetch(RAW+"/redeem/codes/"+f.name).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}));
    })
    .then(function(arr){
      arr=(arr||[]).filter(Boolean).sort(function(a,b){return(b.createdAt||0)-(a.createdAt||0);});
      if(!arr.length){$("tbody").innerHTML='<tr><td colspan="5" class="mut">暂无兑换码。</td></tr>';$("status").textContent="共 0 个。";return;}
      $("tbody").innerHTML=arr.map(function(c){
        var eff=(c.effect&&c.effect.type==="quota")?("+"+(c.effect.value||0)+" 额度"):JSON.stringify(c.effect||{});
        var st=c.status==="used"?'<span class="status-used">已使用</span>':'<span class="status-unused">未使用</span>';
        return '<tr><td><code>'+esc(c.code)+'</code></td><td>'+esc(eff)+'</td><td>'+st+'</td><td>'+esc(fmtTs(c.createdAt))+'</td><td><button class="d" data-del="'+esc(c.code)+'">删除</button></td></tr>';
      }).join("");
      $("status").textContent="共 "+arr.length+" 个。";
    })
    .catch(function(e){$("status").textContent="读取失败："+e.message;});
  }

  function putCode(code,value){
    var obj={code:code,effect:{type:"quota",value:Number(value)||0},status:"unused",createdAt:Date.now(),createdBy:"admin"};
    var path="redeem/codes/redeem_"+code+".json";
    return fetch(API+"/"+path,{method:"PUT",headers:hdr(),body:JSON.stringify({message:"add "+code,content:btoa(unescape(encodeURIComponent(JSON.stringify(obj)))),branch:"main"})})
      .then(function(r){if(!r.ok)return r.text().then(function(t){throw new Error("HTTP "+r.status+" "+t.slice(0,120));});return r.json();});
  }
  function delCode(code){
    return fetch(API+"/redeem/codes/redeem_"+code+".json",{headers:hdr()}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(m){if(!m)return;return fetch(API+"/redeem/codes/redeem_"+code+".json",{method:"DELETE",headers:hdr(),body:JSON.stringify({message:"del "+code,sha:m.sha,branch:"main"})}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);});});
  }

  $("btnLogin").addEventListener("click",function(){
    var t=$("ghToken").value.trim();if(!t){alert("请粘贴令牌");return;}
    setTok(t);
    fetch("https://api.github.com/user",{headers:hdr()}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(u){alert("已登录："+u.login);$("loginSec").classList.add("hidden");$("codesSec").classList.remove("hidden");listCodes();})
      .catch(function(e){alert("令牌无效："+e.message);});
  });
  $("btnReload").addEventListener("click",listCodes);
  $("btnAdd").addEventListener("click",function(){
    var code=$("newCode").value.trim().toUpperCase();if(!code)code=genCode();
    if(!/^[A-Z0-9]{6,16}$/.test(code)){alert("兑换码只能是 6-16 位字母数字");return;}
    var value=$("newValue").value.trim();
    if(!confirm("创建兑换码 "+code+"（+"+value+" 额度）？"))return;
    $("status").textContent="创建中…";
    putCode(code,value).then(function(){$("newCode").value="";$("status").textContent="已创建。";listCodes();}).catch(function(e){$("status").textContent="创建失败："+e.message;});
  });
  $("tbody").addEventListener("click",function(e){
    var b=e.target.closest("[data-del]");if(!b)return;
    var code=b.getAttribute("data-del");
    if(!confirm("删除兑换码 "+code+"？"))return;
    delCode(code).then(function(){$("status").textContent="已删除。";listCodes();}).catch(function(e){$("status").textContent="删除失败："+e.message;});
  });

  if(tok()){$("loginSec").classList.add("hidden");$("codesSec").classList.remove("hidden");listCodes();}
})();
</script>

</body>
</html>
