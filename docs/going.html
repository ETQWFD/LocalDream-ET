<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>管理后台 — Local Dream ET</title>
<link rel="icon" href="assets/favicon.ico" sizes="any" />
<link rel="icon" href="assets/icon-192.png" type="image/png" />
<style>
  :root{--bg:#fff;--ink:#111418;--mut:#6b7280;--line:#e8eaee;--soft:#f4f5f7;--bad:#d9534f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:0 24px}
  nav{position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 0}
  .navin{max-width:960px;margin:0 auto;padding:0 24px;display:flex;gap:18px;align-items:center}
  .brand{font-weight:700}
  a{color:inherit;text-decoration:none}
  h1{font-size:24px;margin:24px 0 6px}
  h2{font-size:18px;margin:28px 0 12px}
  .mut{color:var(--mut);font-size:13px}
  input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit}
  button{padding:10px 18px;border:1px solid var(--ink);border-radius:8px;background:var(--ink);color:#fff;font-weight:600;cursor:pointer;font:inherit}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:14px 0}
  .entry{border:1px solid var(--line);border-radius:12px;padding:18px;display:block}
  .entry b{display:block;font-size:15px;margin-bottom:4px}
  .entry span{color:var(--mut);font-size:12.5px}
  .card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
  .card .meta{color:var(--mut);font-size:12px;margin-bottom:8px}
  .card .meta b{color:var(--ink)}
  .card .body{font-size:14.5px;white-space:pre-wrap}
  .hidden{display:none}
  .empty{color:var(--mut);padding:20px;text-align:center}
</style>
</head>
<body>

<nav><div class="navin"><span class="brand">管理后台</span><a href="index.html">返回官网</a></div></nav>

<div class="wrap">
  <h1>管理后台门禁</h1>
  <p class="mut">输入 GitHub 私人令牌验证身份后进入；令牌仅存本浏览器会话。</p>

  <div id="loginSec">
    <div class="row">
      <input id="ghToken" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" inputmode="text" spellcheck="false" placeholder="粘贴 GitHub 私人令牌（ghp_...）" style="flex:1;min-width:280px" />
      <button id="btnLogin">确认</button>
    </div>
    <div class="mut" id="loginMsg"></div>
  </div>

  <div id="mainSec" class="hidden">
    <h2>后台入口</h2>
    <div class="grid">
      <a class="entry" href="data.html"><b>卡密管理</b><span>兑换码增删 / 额度 / 订阅</span></a>
      <a class="entry" href="admin.html"><b>用户反馈</b><span>App 端反馈卡片列表</span></a>
      <a class="entry" href="dan.html"><b>数据面板</b><span>评分 / 下载日志 / 在线设备 / 发公告</span></a>
      <a class="entry" href="dinner.html"><b>中国地图</b><span>设备 IP 分布热力</span></a>
    </div>
  </div>

  <h2>公告（所有人可看，只读）</h2>
  <div class="mut" id="annStatus">加载中…</div>
  <div id="annList"></div>
</div>

<script>
(function(){
  "use strict";
  var RAW="https://raw.githubusercontent.com/ETQWFD/LocalDream-ET-ratings/main";
  var API="https://api.github.com/repos/ETQWFD/LocalDream-ET-ratings/contents";
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  function fmtTs(ts){if(ts==null||ts==="")return"";try{var t=ts;if(typeof t==="number"&&t<1e12)t=t*1000;else if(typeof t==="string"&&/^\d+$/.test(t)&&Number(t)<1e12)t=Number(t)*1000;return new Date(t).toLocaleString("zh-CN",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});}catch(e){return String(ts);}}

  /* 公告只读列表（公开仓，无需令牌） */
  function loadAnn(){
    $("annStatus").textContent="加载中…";
    fetch(API+"/announcements").then(function(r){
      if(r.status===404){return fetch(API+"/announcements/.gitkeep",{method:"PUT",headers:{"Accept":"application/vnd.github+json"},body:JSON.stringify({message:"init",content:btoa("# keep\n"),branch:"main"})}).then(function(){return fetch(API+"/announcements");});}
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r;
    })
    .then(function(r){return r.json();})
    .then(function(files){
      var js=(files||[]).filter(function(f){return /^announce_.*\.json$/.test(f.name);});
      return Promise.all(js.map(function(f){return fetch(RAW+"/announcements/"+f.name).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});}));
    })
    .then(function(arr){
      arr=(arr||[]).filter(Boolean).sort(function(a,b){return(b.ts||0)-(a.ts||0);});
      if(!arr.length){$("annList").innerHTML='<div class="empty">暂无公告。</div>';$("annStatus").textContent="共 0 条。";return;}
      $("annList").innerHTML=arr.map(function(a){
        var tg=a.target==="app"?"手机端":(a.target==="server"?"服务端":"全部");
        return '<div class="card"><div class="meta"><b>'+esc(a.title||"")+'</b> · '+esc(tg)+' · '+esc(fmtTs(a.ts))+'</div><div class="body">'+esc(a.content||"")+'</div></div>';
      }).join("");
      $("annStatus").textContent="共 "+arr.length+" 条。";
    })
    .catch(function(e){$("annList").innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>';$("annStatus").textContent="失败";});
  }

  /* 门禁 */
  function tok(){try{return sessionStorage.getItem("et_going_gh")||"";}catch(e){return "";}}
  function setTok(t){try{sessionStorage.setItem("et_going_gh",t);}catch(e){}}
  function hdr(){return {"Authorization":"Bearer "+tok(),"Accept":"application/vnd.github+json"};}
  function enter(){$("loginSec").classList.add("hidden");$("mainSec").classList.remove("hidden");}
  $("btnLogin").addEventListener("click",function(){
    var t=$("ghToken").value.trim();if(!t){$("loginMsg").textContent="请粘贴令牌";return;}
    setTok(t);var b=$("btnLogin");b.disabled=true;b.textContent="校验中…";
    fetch("https://api.github.com/user",{headers:hdr()}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(function(u){b.disabled=false;b.textContent="确认";$("loginMsg").textContent="已登录："+u.login;enter();})
      .catch(function(e){b.disabled=false;b.textContent="确认";$("loginMsg").textContent="令牌无效："+e.message;});
  });

  loadAnn();
  if(tok())enter();
})();
</script>

</body>
</html>
