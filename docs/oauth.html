<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local Dream ET · GitHub 授权</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:-apple-system,"Segoe UI",sans-serif;background:#0b1220;color:#e8eefc}
.card{max-width:420px;padding:28px;border-radius:20px;background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.14);text-align:center}
h3{margin:0 0 10px;font-weight:600}
p{color:#9fb0cc;font-size:14px;line-height:1.7}
a.btn{display:block;margin-top:18px;padding:14px;border-radius:14px;background:#2f6bff;color:#fff;
text-decoration:none;font-weight:600}
.err{color:#ff9d9d}
</style></head><body>
<div class="card">
<h3>正在返回 Local Dream ET</h3>
<p id="msg">如果应用没有自动打开，请点下面的按钮完成登录。</p>
<a class="btn" id="l" href="#">打开 Local Dream ET</a>
</div>
<script>
var q=location.search||"", code=(q.match(/[?&]code=([^&]+)/)||[])[1];
var err=(q.match(/[?&]error_description=([^&]+)/)||[])[1];
var link="localdreamet://oauth"+(code?("?code="+code):"");
document.getElementById("l").href=link;
if(err){document.getElementById("msg").innerHTML='<span class="err">授权失败：'+decodeURIComponent(err)+'</span>';}
if(code){
  // 先尝试自动跳转；浏览器若拦截自定义 scheme，用户点按钮即可（按钮就是用户手势）。
  try{location.href=link;}catch(e){}
}
</script>
</body></html>
