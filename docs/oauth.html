<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nightmare Road-ET · GitHub 授权</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:-apple-system,"Segoe UI",sans-serif;background:#0b1220;color:#e8eefc}
.card{max-width:420px;padding:28px;border-radius:20px;background:rgba(255,255,255,.06);
border:1px solid rgba(255,255,255,.14);text-align:center}
h3{margin:0 0 10px;font-weight:600}
p{color:#9fb0cc;font-size:14px;line-height:1.7}
a.btn{display:block;margin-top:18px;padding:14px;border-radius:14px;background:#2f6bff;color:#fff;
text-decoration:none;font-weight:600}
.err{color:#ff9d9d}
</style></head><body>
<div class="card">
<h3>正在返回 Nightmare Road-ET</h3>
<p id="msg">如果应用没有自动打开，请点下面的按钮完成登录。</p>
<a class="btn" id="l" href="#">打开 Nightmare Road-ET</a>
</div>
<script>
var q=location.search||"", code=(q.match(/[?&]code=([^&]+)/)||[])[1];
var err=(q.match(/[?&]error_description=([^&]+)/)||[])[1];
var link="localdreamet://oauth"+(code?("?code="+code):"");
document.getElementById("l").href=link;
if(err){document.getElementById("msg").innerHTML='<span class="err">授权失败：'+decodeURIComponent(err)+'</span>';}
if(code){
  // 先尝试自动跳转；浏览器若拦截自定义 scheme，用户点按钮即可（按钮就是用户手势）。
  try{location.href=link;}catch(e){}
  // et.243：部分浏览器（含微信内置）拦截自定义 scheme，这里额外提供
  // “复制回跳链接”，回到 App 粘贴即可登录。
  document.getElementById("msg").innerHTML =
    '已拿到授权码。若应用没有自动打开，请点上面的按钮；仍不行就复制下面的链接，回到 App 的“粘贴回跳链接”框里完成登录。';
  var box=document.createElement("textarea");
  box.id="raw"; box.value=location.href;
  box.style.cssText="width:100%;margin-top:14px;min-height:70px;font-size:12px;background:rgba(255,255,255,.08);color:#e8eefc;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px";
  document.querySelector(".card").appendChild(box);
  var cp=document.createElement("a");
  cp.className="btn"; cp.href="javascript:void(0)"; cp.textContent="复制回跳链接";
  cp.onclick=function(){box.select();try{document.execCommand("copy");cp.textContent="已复制，回到 App 粘贴"}catch(e){cp.textContent="请长按上面文本框手动复制"}};
  document.querySelector(".card").appendChild(cp);
}
</script>
</body></html>
